<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Timewright</title>
    <script type="module" crossorigin src="./assets/index-BT1iCC7S.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Bo1q9ZIH.css">
  <style id="tw-theme">@font-face{font-family:"Orbitron";src:url("fonts/orbitron.woff2") format("woff2");font-weight:400 900;font-display:swap;}@font-face{font-family:"Space Grotesk";src:url("fonts/space-grotesk.woff2") format("woff2");font-weight:300 700;font-display:swap;}:root{--font-heading:Orbitron, Verdana, sans-serif;--font-body:"Space Grotesk", -apple-system, "Segoe UI", sans-serif;--bg:#10141c;--panel:#1a2029;--card:#212a36;--soft:#1e2733;--soft-2:#232d3b;--ink:#dbe5f1;--muted:#8b98ab;--line:#2b3543;--accent:#4cc2ff;--accent-ink:#0a121c;--accent-soft:#12283a;--event:#ff9e3d;--portal:#a98aff;--map-bg:#0b0e14}</style></head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand-crumb">
          <span id="world-title" class="world-title"></span>
          <span class="crumb-sep" id="crumb-sep" hidden>/</span>
          <nav id="breadcrumb" aria-label="Map hierarchy"></nav>
        </div>
        <div class="topbar-controls">
          <form id="date-form">
            <label class="visually-hidden" for="date-input">Date</label>
            <input id="date-input" type="text" autocomplete="off" spellcheck="false" placeholder="Date (e.g. 1815)" />
            <button type="submit">Go</button>
          </form>
          <input id="search" type="search" placeholder="Search world…" aria-label="Search events, people, and locations" />
        </div>
        <button id="filters-toggle" type="button" class="filters-toggle" aria-expanded="false" aria-controls="filters-panel">⚙ Filters</button>
      </header>

      <div id="filters-panel"></div>

      <div id="stepbar">
        <div class="step-controls">
          <button id="prev-step" type="button" title="Previous step (←)" aria-label="Previous step">‹</button>
          <button id="step-label" type="button" class="step-label-btn" title="Open current step details"></button>
          <button id="next-step" type="button" title="Next step (→)" aria-label="Next step">›</button>
        </div>
        <div class="trace-controls">
          <label class="trace-label" for="trace-select">Follow:</label>
          <select id="trace-select" aria-label="Follow a character or vessel"></select>
          <button id="clear-trace" type="button" class="ghost-btn" hidden title="Return to span view">✕</button>
        </div>
      </div>

      <div id="active-filters" hidden></div>

      <main id="map-wrap">
        <div id="map" aria-label="Interactive timeline map"></div>
        <div id="general-banner" class="general-banner" hidden></div>
      </main>

      <div id="timeline">
        <div class="timeline-header">
          <span id="domain-readout" class="timeline-meta"></span>
          <span id="playhead-readout" class="playhead-readout"></span>
          <button id="reset-span" type="button" class="mini-link" hidden>Full timeline</button>
        </div>
        <div id="context" aria-label="Timeline overview range"></div>
        <div id="strip" aria-label="Visible timeline"></div>
      </div>

      <aside id="card" hidden aria-live="polite"></aside>
      <div id="results" hidden></div>
      <p id="status" role="status"></p>
    </div>
  </body>
</html>
