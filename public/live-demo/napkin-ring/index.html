<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Napkin ring — photo to 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0e1c; overflow: hidden; }
  #hint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    color: #55648c; font: 12px/1.4 system-ui, sans-serif; letter-spacing: 0.04em;
    pointer-events: none; transition: opacity 0.6s; white-space: nowrap;
  }
  #hint.err { color: #d08a8a; }
  #dl {
    position: fixed; top: 12px; right: 14px;
    color: #8fa3c7; text-decoration: none;
    font: 12px/1 system-ui, sans-serif; letter-spacing: 0.04em;
    padding: 6px 12px; border: 1px solid rgba(143, 163, 199, 0.35);
    border-radius: 999px; background: rgba(10, 14, 28, 0.65);
    transition: color 0.2s, border-color 0.2s;
  }
  #dl:hover { color: #cfd8ff; border-color: rgba(207, 216, 255, 0.6); }
</style>
</head>
<body>
<div id="hint">loading model…</div>
<a id="dl" href="./napkin-ring-print.stl" download="napkin-ring-print.stl">print-ready STL (35&nbsp;mm)&nbsp;↓</a>
<script>
  // Classic script: surface failures as visible text instead of a silent dark page.
  (function () {
    var hint = document.getElementById('hint');
    window.__fail = function (msg) {
      hint.textContent = msg;
      hint.className = 'err';
      hint.style.opacity = 1;
    };
    window.addEventListener('error', function (e) {
      window.__fail('error: ' + (e.message || 'a script failed to load'));
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      window.__fail('error: ' + (r && r.message ? r.message : r));
    });
    setTimeout(function () {
      if (!window.__ok) window.__fail('still nothing after 15 s — hard refresh or try another browser');
    }, 15000);
  })();
</script>
<script type="module">
import * as THREE from './three.module.js?v=2';
import { OrbitControls } from './addons/controls/OrbitControls.js?v=2';
import { GLTFLoader } from './addons/loaders/GLTFLoader.js?v=2';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e1c);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.001, 10);

// Warm key from the upper right (like the source photos), cool fill, soft ambient.
scene.add(new THREE.HemisphereLight(0xcfd8ff, 0x2a1e14, 0.9));
const key = new THREE.DirectionalLight(0xffe8c8, 2.2);
key.position.set(1.2, 1.6, 0.9);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fa3c7, 0.6);
fill.position.set(-1.2, 0.5, -0.8);
scene.add(fill);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;

new GLTFLoader().load('./model.glb', (g) => {
  const obj = g.scene;

  // Center the model and fit the camera to its bounding box.
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  obj.position.sub(center);
  scene.add(obj);

  const maxDim = Math.max(size.x, size.y, size.z);
  const dist = (maxDim / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)))) * 1.9;
  // Elevated three-quarter view, matching the source photos.
  camera.position.set(dist * 0.85, dist * 0.6, dist * 0.72);
  camera.near = maxDim / 100;
  camera.far = maxDim * 100;
  camera.updateProjectionMatrix();
  controls.target.set(0, 0, 0);
  controls.minDistance = maxDim * 0.6;
  controls.maxDistance = maxDim * 20;
  controls.update();

  window.__ok = true;
  const hint = document.getElementById('hint');
  hint.textContent = 'drag to orbit · scroll to zoom';
  setTimeout(() => { if (!hint.className) hint.style.opacity = 0; }, 4000);
}, undefined, (err) => {
  window.__fail('failed to load model: ' + (err && err.message ? err.message : err));
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
